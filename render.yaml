# Render Blueprint for the hosted Teller connector.
# Render prompts you for every value marked `sync: false`; none of your secrets live in this file.
services:
  - type: web
    name: teller-bank-sync
    runtime: node
    # Free plan: no disk, and the service sleeps after 15 minutes idle. Bank logins are kept
    # as an encrypted setting (TELLER_STORE_BLOB) instead of a file.
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false # redeploy by hand, so nothing changes under a server that holds bank access
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELLER_ENV
        value: development # sandbox = fake banks, development = real banks (free, 100 limit), production = billed
      - key: TELLER_DATA_DIR
        value: /tmp/teller
      - key: TELLER_APPLICATION_ID
        sync: false
      - key: TELLER_CERT_PEM
        sync: false
      - key: TELLER_KEY_PEM
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: TELLER_STORE_KEY
        sync: false
